<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Day Is It?</title>
<meta name="description" content="Today's niche holiday, on a pixel tear-off calendar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link id="favicon" rel="icon" href="data:,">
<style>
  :root {
    --cobalt: #3550ff;
    --cobalt-deep: #1b2a99;
    --paper: #ffffff;
    --band: #ff4433;
    --butter: #ffe14d;
    --ink: #000000;
    --px: 4px; /* one "pixel" of chrome */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--cobalt);
    /* faint pixel grid */
    background-image:
      linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
    background-size: 16px 16px;
    color: var(--ink);
    font-family: "VT323", ui-monospace, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 48px;
  }
  .stage {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---------- the calendar pad ---------- */
  .pad {
    position: relative;
    width: 100%;
    padding-top: 18px; /* room for the rings */
  }
  .rings {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-around;
    padding: 0 22%;
    z-index: 3;
    pointer-events: none;
  }
  .ring {
    width: 16px; height: 32px;
    background: var(--butter);
    border: var(--px) solid var(--ink);
  }
  /* the pages left underneath, to read as a stack */
  .pad::before, .pad::after {
    content: "";
    position: absolute;
    left: 8px; right: -8px;
    top: 26px; bottom: -8px;
    background: var(--paper);
    border: var(--px) solid var(--ink);
    z-index: 0;
  }
  .pad::after { left: 16px; right: -16px; top: 34px; bottom: -16px; background: #e8ecff; z-index: -1; }

  .page {
    position: relative;
    z-index: 1;
    background: var(--paper);
    border: var(--px) solid var(--ink);
    text-align: center;
    transform-origin: 50% 0;
  }
  .band {
    background: var(--band);
    color: var(--paper);
    font-family: "Press Start 2P", monospace;
    font-size: 15px;
    letter-spacing: 2px;
    padding: 26px 12px 14px;
    border-bottom: var(--px) solid var(--ink);
  }
  .daynum {
    font-family: "Press Start 2P", monospace;
    font-size: clamp(64px, 22vw, 96px);
    line-height: 1;
    margin: 22px 0 4px;
  }
  .weekday { font-size: 28px; margin: 0 0 6px; }
  .sprite {
    display: block;
    margin: 6px auto 4px;
    width: 144px; height: 144px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .holiday, .empty-note { font-weight: 400; }
  .holiday {
    font-size: clamp(40px, 11vw, 54px);
    line-height: .95;
    margin: 6px 24px 28px;
    text-wrap: balance;
  }
  .empty-note { font-size: 24px; line-height: 1.1; margin: 8px 28px 30px; text-wrap: balance; }

  /* tear-off when changing days */
  .page.tear { animation: tear .32s steps(6) forwards; }
  .page.drop { animation: drop .28s steps(5); }
  @keyframes tear {
    to { transform: translate(-20px, -60px) rotate(-9deg); opacity: 0; }
  }
  @keyframes drop {
    from { transform: translateY(-14px); }
    to { transform: none; }
  }

  /* ---------- day controls ---------- */
  .controls {
    display: flex;
    gap: 12px;
    margin-top: 36px;
    width: 100%;
  }
  .controls button { flex: 1; }
  button {
    font-family: "Press Start 2P", monospace;
    font-size: 11px;
    line-height: 1.4;
    color: var(--ink);
    background: var(--butter);
    border: var(--px) solid var(--ink);
    box-shadow: var(--px) var(--px) 0 var(--cobalt-deep);
    padding: 12px 8px;
    cursor: pointer;
  }
  button:hover { background: #fff07f; }
  button:active { transform: translate(var(--px), var(--px)); box-shadow: none; }
  button:disabled { opacity: .45; cursor: default; transform: none; box-shadow: var(--px) var(--px) 0 var(--cobalt-deep); }
  button:focus-visible { outline: var(--px) solid var(--paper); outline-offset: 3px; }
  .today-btn[hidden] { display: none; }

  /* ---------- the other holidays ---------- */
  .also {
    width: 100%;
    margin-top: 32px;
    color: var(--paper);
  }
  .also h2 {
    font-family: "Press Start 2P", monospace;
    font-weight: 400;
    font-size: 12px;
    margin: 0 0 14px;
    text-align: center;
  }
  .also ul {
    list-style: none;
    margin: 0; padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }
  .chip {
    font-family: "VT323", monospace;
    font-size: 22px;
    line-height: 1;
    max-width: 100%;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px 6px 8px;
    background: var(--paper);
    text-align: left;
  }
  .chip canvas { width: 24px; height: 24px; image-rendering: pixelated; flex: none; }
  .also .hint { font-size: 20px; text-align: center; margin: 12px 0 0; opacity: .8; }

  footer {
    margin-top: 40px;
    color: var(--paper);
    opacity: .7;
    font-size: 18px;
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {
    .page.tear, .page.drop { animation: none; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="pad">
    <div class="rings" aria-hidden="true"><div class="ring"></div><div class="ring"></div></div>
    <article class="page" id="page" aria-live="polite">
      <div class="band" id="month">&nbsp;</div>
      <div class="daynum" id="daynum">&nbsp;</div>
      <p class="weekday" id="weekday">&nbsp;</p>
      <canvas class="sprite" id="sprite" width="12" height="12" aria-hidden="true"></canvas>
      <h1 class="holiday" id="holiday">Loading…</h1>
    </article>
  </div>

  <nav class="controls" aria-label="Change day">
    <button id="prev" type="button">Yesterday</button>
    <button id="today" class="today-btn" type="button" hidden>Today</button>
    <button id="next" type="button">Tomorrow</button>
  </nav>

  <section class="also" id="also" hidden>
    <h2 id="also-title">Also today</h2>
    <ul id="also-list"></ul>
    <p class="hint">Tap one to put it on the page.</p>
  </section>

  <footer>Holiday list from nationaltoday.com, refreshed monthly.</footer>
</main>

<script>
/* ---------------- pixel art ----------------
   Each sprite is 12x12. One character per pixel; "." is transparent. */
const PALETTE = {
  k: "#000000", w: "#ffffff", r: "#ff4433", o: "#ff9f1c", y: "#ffd23f",
  g: "#3bb143", G: "#1e7a2a", b: "#3a86ff", p: "#ff70a6", P: "#9b5de5",
  n: "#8b5a2b", N: "#5c3a1a", t: "#f4c27a", l: "#b8c0e0",
};
const SPRITES = {
  candy: [
    "............","............","............",
    "k..kkkkkk..k","kk.kpwppk.kk","kpkppppppkpk",
    "kpkppppppkpk","kk.kppppk.kk","k..kkkkkk..k",
    "............","............","............"],
  sandwich: [
    "............","............","..kkkkkkkk..",
    ".kttttttttk.","kttttttttttk","kgGgggGgggGk",
    "krrrrrrrrrrk","kyyyyyyyyyyk","kttttttttttk",
    ".kkkkkkkkkk.","............","............"],
  pizza: [
    "............","kkkkkkkkkkkk","knnnnnnnnnnk",
    ".kyyryyyyyk.",".kyyyyyryyk.","..kyryyyyk..",
    "..kyyyyryk..","...kyyyyk...","...kyryyk...",
    "....kyyk....",".....kk.....","............"],
  cupcake: [
    "............",".....rr.....","....kppk....",
    "...kpwppk...","..kppppppk..",".kppppppppk.",
    ".kkkkkkkkkk.",".knonononok.","..knononok..",
    "..kkkkkkkk..","............","............"],
  cookie: [
    "............","...kkkkkk...","..kttttttk..",
    ".kttNttttNk.","kttttttNtttk","ktNttttttttk",
    "kttttNttttNk","kttttttttttk",".ktNttttNtk.",
    "..kttttttk..","...kkkkkk...","............"],
  coffee: [
    "............","...l..l.....","....l..l....",
    "............",".kkkkkkkk...",".kNNNNNNk...",
    ".kbbbbbbkkk.",".kbbbbbbk.k.",".kbbbbbbk.k.",
    ".kbbbbbbkkk.","..kkkkkk....","............"],
  icecream: [
    "....kkkk....","...kppppk...","..kpwppppk..",
    "..kppppppk..","..kkkkkkkk..","..kotototk..",
    "...ktotok...","...kototk...","....ktok....",
    "....kotk....",".....kk.....","............"],
  cocktail: [
    "............",".kkkkkkkkkk.",".kppppppppk.",
    "..kppwpppk..","...kppppk...","....kppk....",
    ".....kk.....",".....kk.....",".....kk.....",
    "...kkkkkk...","............","............"],
  dog: [
    "............",".kk......kk.","kNNk....kNNk",
    "kNNkkkkkkNNk","kNkttttttkNk","kNkttttttkNk",
    "..ktkttktk..","..kttkkttk..","..kttttttk..",
    "...kttttk...","....kkkk....","............"],
  cat: [
    "............",".k........k.",".kok....kok.",
    ".kookkkkook.",".kooooooook.",".kokooookok.",
    ".kooooooook.",".kooopooook.",".kooooooook.",
    "..kooooook..","...kkkkkk...","............"],
  heart: [
    "............",".kkk....kkk.","krrrk..krrrk",
    "krwrrkkrrrrk","krrrrrrrrrrk",".krrrrrrrrk.",
    "..krrrrrrk..","...krrrrk...","....krrk....",
    ".....kk.....","............","............"],
  note: [
    "............","......kk....","......kPk...",
    "......kPPk..","......kPkPk.","......kPk.k.",
    "......kPk...","..kkkkkPk...",".kPPPPPPk...",
    ".kPPPPPk....","..kkkkk.....","............"],
  book: [
    "............",".kkkkkkkkkk.",".kbbbbbbbbk.",
    ".kbwwwwwwbk.",".kbbbbbbbbk.",".kbbwwwwbbk.",
    ".kbbbbbbbbk.",".kbbbbbbbbk.",".kkkkkkkkkk.",
    ".kwwwwwwwwk.",".kkkkkkkkkk.","............"],
  balloon: [
    "....kkkk....","...krrrrk...","..krwrrrrk..",
    "..krwrrrrk..","..krrrrrrk..","..krrrrrrk..",
    "...krrrrk...","....kkkk....",".....rk.....",
    "......k.....",".....k......","......k....."],
  star: [
    ".....kk.....","....kyyk....","....kyyk....",
    "kkkkkyykkkkk","kyyyyyyyyyyk",".kyyyyyyyyk.",
    "..kyyyyyyk..","..kyyyyyyk..",".kyyykkyyyk.",
    ".kyyk..kyyk.",".kk......kk.","............"],
  flag: [
    "............",".k..........",".kkkkkkk....",
    ".krrrrrrkk..",".krrwrrrrrk.",".krrrrrrkk..",
    ".kkkkkkk....",".k..........",".k..........",
    ".k..........","kkk.........","............"],
  plant: [
    "............",".kkk....kkk.","kgggk..kgggk",
    "kgGggkkggGgk",".kgggGGgggk.","..kkkGGkkk..",
    ".....GG.....","..kkkkkkkk..","..knnnnnnk..",
    "...knnnnk...","...knnnnk...","....kkkk...."],
};

// Words in a holiday name decide its picture first; the category is the fallback.
const KEYWORDS = [
  ["sandwich", /\b(sandwich|sub|hoagie|burger|hamburger|hot ?dog|blt|reuben|french dip|grilled cheese|taco|burrito|nacho|scrapple|sardine)s?\b/],
  ["pizza", /\b(pizza|calzone|pepperoni)s?\b/],
  ["candy", /\b(candy|candies|chocolate|lollipop|gum|caramel|fudge|toffee|jelly ?bean|marshmallow|licorice|gummy|bonbon|truffle)s?\b/],
  ["icecream", /\b(ice cream|sundae|gelato|sorbet|popsicle|frozen yogurt|milkshake)s?\b/],
  ["cupcake", /\b(cake|cupcake|muffin|pie|pudding|donut|doughnut|dessert|brownie|cheesecake|parfait|mousse|bundt|baklava|tart|eclair)s?\b/],
  ["cookie", /\b(cookie|biscuit|cracker|pretzel|gingerbread|waffle|pancake|bread|bagel|toast)s?\b/],
  ["coffee", /\b(coffee|espresso|cappuccino|latte|mocha|tea|cocoa|hot chocolate)s?\b/],
  ["cocktail", /\b(wine|beer|stout|ale|cocktail|martini|margarita|vodka|whiskey|bourbon|rum|tequila|wallbanger|champagne|mimosa|sangria|mojito)s?\b/],
  ["dog", /\b(dog|puppy|puppies|pup|canine)s?\b/],
  ["cat", /\b(cat|kitten|kitty|feline)s?\b/],
  ["plant", /\b(plant|tree|garden|flower|vegan|vegetable|leaf|earth|recycl\w*|environment\w*|forest|nature|salad|pickle|avocado|guacamole)s?\b/],
  ["heart", /\b(love|hug|kiss|kindness|friend\w*|valentine|heart|sweetheart|gratitude|mom|dad|sibling|family)s?\b/],
  ["note", /\b(music|song|saxophone|piano|pianist|jazz|guitar|band|metal|dance|ballet|jukebox|sing\w*)s?\b/],
  ["book", /\b(book|read\w*|author|writ\w*|novel|library|literacy|poetry|poem|word|story|stories|education|teacher)s?\b/],
];
const CATEGORY_SPRITE = {
  "Food & Beverage": "cupcake", "Fun": "balloon", "Animal": "cat",
  "Arts & Entertainment": "note", "Health": "heart", "Relationship": "heart",
  "Federal": "flag", "Cultural": "flag", "Religious": "star",
  "Special Interest": "star", "Cause": "star", "Appreciation": "star",
};
function spriteFor(h) {
  const name = h.name.toLowerCase();
  for (const [key, re] of KEYWORDS) if (re.test(name)) return key;
  return CATEGORY_SPRITE[h.category] || "balloon";
}
function drawSprite(canvas, key) {
  const rows = SPRITES[key] || SPRITES.balloon;
  canvas.width = 12; canvas.height = 12;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, 12, 12);
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === ".") return;
    ctx.fillStyle = PALETTE[ch];
    ctx.fillRect(x, y, 1, 1);
  }));
}
function setFavicon(key) {
  const c = document.createElement("canvas");
  drawSprite(c, key);
  const big = document.createElement("canvas");
  big.width = big.height = 48;
  const ctx = big.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(c, 0, 0, 48, 48);
  document.getElementById("favicon").href = big.toDataURL("image/png");
}

/* ---------------- data ---------------- */
function parseCSV(text) {
  const rows = []; let row = [], field = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') q = false;
      else field += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field); rows.push(row); row = []; field = "";
    } else field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  const [head, ...body] = rows.filter(r => r.length > 1);
  if (!head) return [];
  return body.map(r => Object.fromEntries(head.map((h, i) => [h, r[i] || ""])));
}

// Fun and food first, official and serious ones last.
const CATEGORY_ORDER = ["Food & Beverage", "Fun", "Special Interest", "Animal", "Arts & Entertainment",
  "Relationship", "Appreciation", "Health", "Cause", "Cultural", "Religious", "Federal"];
function rank(h) {
  const i = CATEGORY_ORDER.indexOf(h.category);
  return [i < 0 ? CATEGORY_ORDER.length : i, h.name.toLowerCase().startsWith("national ") ? 0 : 1, h.name.toLowerCase()];
}
function byRank(a, b) {
  const x = rank(a), y = rank(b);
  for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] < y[i] ? -1 : 1;
  return 0;
}

const byDate = new Map();
let current = null;   // Date being shown
let featured = null;  // index of the featured holiday for that day

/* ---------------- dates ---------------- */
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const fromIso = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const todayLocal = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };

/* ---------------- render ---------------- */
const $ = id => document.getElementById(id);

function render() {
  const key = iso(current);
  const list = byDate.get(key) || [];
  const isToday = key === iso(todayLocal());
  const offset = Math.round((current - todayLocal()) / 864e5);

  $("month").textContent = current.toLocaleDateString(undefined, { month: "long" }).toUpperCase();
  $("daynum").textContent = current.getDate();
  $("weekday").textContent = current.toLocaleDateString(undefined, { weekday: "long" });

  $("prev").textContent = offset === 0 ? "Yesterday" : offset === 1 ? "Today" : "Back a day";
  $("next").textContent = offset === 0 ? "Tomorrow" : offset === -1 ? "Today" : "Next day";
  $("today").hidden = Math.abs(offset) <= 1;

  if (!list.length) {
    drawSprite($("sprite"), "star");
    $("holiday").className = "empty-note";
    $("holiday").textContent = byDate.size
      ? "Nothing on the calendar for this day yet. New months are added on the 25th."
      : "The holiday list is still being filled in. Check back soon.";
    $("also").hidden = true;
    if (isToday) setFavicon("star");
    document.title = "What Day Is It?";
    return;
  }

  const main = list[featured] || list[0];
  const spriteKey = spriteFor(main);
  drawSprite($("sprite"), spriteKey);
  $("holiday").className = "holiday";
  $("holiday").textContent = main.name;
  document.title = isToday ? `Today is ${main.name}` : `${main.name} · ${current.toLocaleDateString(undefined, { month: "short", day: "numeric" })}`;
  if (isToday) setFavicon(spriteKey);

  const others = list.filter(h => h !== main);
  $("also").hidden = others.length === 0;
  $("also-title").textContent = isToday ? "Also today" : "Also on this day";
  const ul = $("also-list");
  ul.replaceChildren();
  others.forEach(h => {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "chip";
    const c = document.createElement("canvas");
    drawSprite(c, spriteFor(h));
    c.setAttribute("aria-hidden", "true");
    btn.append(c, document.createTextNode(h.name));
    btn.addEventListener("click", () => { featured = list.indexOf(h); flip(() => {}, false); });
    li.append(btn);
    ul.append(li);
  });
}

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
let busy = false;
function flip(change, updateUrl = true) {
  if (busy) return;
  const page = $("page");
  const finish = () => {
    change();
    render();
    if (updateUrl) {
      const key = iso(current);
      history.replaceState(null, "", key === iso(todayLocal()) ? location.pathname : `?d=${key}`);
    }
    page.classList.remove("tear");
    if (!reduceMotion.matches) { page.classList.add("drop"); page.addEventListener("animationend", () => page.classList.remove("drop"), { once: true }); }
    busy = false;
  };
  if (reduceMotion.matches) { finish(); return; }
  busy = true;
  page.classList.add("tear");
  page.addEventListener("animationend", finish, { once: true });
}
const go = n => flip(() => { current = addDays(current, n); featured = 0; });

$("prev").addEventListener("click", () => go(-1));
$("next").addEventListener("click", () => go(1));
$("today").addEventListener("click", () => flip(() => { current = todayLocal(); featured = 0; }));
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("button") && (e.key === "Enter" || e.key === " ")) return;
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "ArrowRight") go(1);
});

/* ---------------- start ---------------- */
(async function start() {
  const param = new URLSearchParams(location.search).get("d");
  current = param && /^\d{4}-\d{2}-\d{2}$/.test(param) ? fromIso(param) : todayLocal();
  featured = 0;
  try {
    const res = await fetch("holidays.csv", { cache: "no-cache" });
    if (!res.ok) throw new Error(res.status);
    for (const h of parseCSV(await res.text())) {
      if (h.type && h.type !== "day") continue; // skip weeks and months
      if (!byDate.has(h.date)) byDate.set(h.date, []);
      byDate.get(h.date).push(h);
    }
    for (const list of byDate.values()) list.sort(byRank);
  } catch (e) {
    console.error("Could not load holidays.csv", e);
  }
  render();
})();
</script>
</body>
</html>
