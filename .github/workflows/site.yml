name: Update site

on:
  push:
    branches: [main]          # publish whenever the site's files change
  schedule:
    # The 25th of every month: grab this month and next month so the
    # calendar is filled in before a new month starts.
    - cron: "13 9 25 * *"
  workflow_dispatch:
    inputs:
      scrape:
        description: "Refresh the holiday list before publishing"
        type: boolean
        default: true
      all_months:
        description: "Scrape all 12 months (otherwise just this month and next)"
        type: boolean
        default: true

permissions:
  contents: write   # commit the updated holidays.csv
  actions: write    # start the publish run after a scrape
  pages: write      # publish the site
  id-token: write

jobs:
  scrape:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scrape)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Scrape
        run: |
          if [ "${{ inputs.all_months }}" = "true" ]; then
            python scrape_holidays.py --all
          else
            python scrape_holidays.py
          fi
      - name: Commit holidays.csv if it changed
        run: |
          git config user.name "holiday-bot"
          git config user.email "holiday-bot@users.noreply.github.com"
          git add holidays.csv
          git diff --cached --quiet || git commit -m "Refresh holidays.csv"
          git push
      # Publish from a fresh run so the site is tied to the new commit.
      # (Publishing from this run would reuse the old commit's version and
      # GitHub would keep serving the previous list.)
      - name: Start the publish run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref main -f scrape=false

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.scrape)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: mkdir _site && cp index.html holidays.csv _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: pages
        uses: actions/deploy-pages@v4
