name: Unstick Pages (one-time)

on:
  workflow_dispatch: {}

permissions:
  pages: write
  deployments: write

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Retire the stuck deployment records
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for id in $(gh api "repos/$REPO/deployments" --jq '.[] | select(.sha|startswith("7bcf239")) | .id'); do
            echo "== $id"
            gh api "repos/$REPO/deployments/$id/statuses" --jq '.[0].state' || true
            gh api -X POST "repos/$REPO/deployments/$id/statuses" -f state=inactive --jq .state || true
            gh api -X DELETE "repos/$REPO/deployments/$id" && echo deleted || true
          done
          gh api "repos/$REPO/pages/deployments/7bcf239fd94ea64eb05336e57f9c2244f3d3f726" || true
