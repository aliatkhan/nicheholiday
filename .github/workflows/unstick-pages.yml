name: Unstick Pages (one-time)

on:
  workflow_dispatch: {}

permissions:
  pages: write
  deployments: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the stuck Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/deployments/7bcf239fd94ea64eb05336e57f9c2244f3d3f726/cancel" || true
          gh api "repos/${{ github.repository }}/pages/deployments/7bcf239fd94ea64eb05336e57f9c2244f3d3f726" || true
